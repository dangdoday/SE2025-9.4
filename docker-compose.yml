services:
  binancebot:
    build: .
    image: binancebot:latest
    environment:
      FT_APP_ENV: docker
      BINANCEBOT__API_SERVER__LISTEN_IP_ADDRESS: 0.0.0.0
    ports:
      - "2907:2907"
    volumes:
      - ./config/config.json:/config/config.json
      - ./user_data:/app/user_data
      - ./data:/app/data
    restart: unless-stopped
